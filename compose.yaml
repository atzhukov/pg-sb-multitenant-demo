services:
  db:
    image: postgres:18
    restart: always
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./db:/var/lib/postgresql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/0-init.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/1-seed.sql
    env_file:
      - .env
  server:
    build:
      context: ./sb-multitenant-demo
    depends_on:
      - db
    ports:
      - ${SB_PORT}:8080
    env_file:
      - .env
    restart: 'unless-stopped'
